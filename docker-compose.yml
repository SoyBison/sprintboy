version: '3.8'

services:
  sprintboy:
    build:
      context: .
      args:
        # `just dev` passes the checkout's commit; a bare `docker compose up`
        # gets the placeholder, which is honest about not knowing.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: sprintboy-dev
    restart: unless-stopped
    volumes:
      - ./src:/app/src:z  # Hot reload source
      - ./.env:/app/.env:z
    environment:
      - ENVIRONMENT=development
    env_file:
      - .env
