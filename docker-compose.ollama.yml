# The model server the bot talks to when LLM_PROVIDER=ollama.
#
# Lives on the unraid box at /mnt/user/appdata/ollama/docker-compose.yml. The
# models volume points at the pool path rather than /mnt/user/... on purpose:
# going through unraid's fuse share makes loading a 13GB model take minutes.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0:11434
      # An agent turn is many short calls; without this the model is unloaded
      # between tool results and every call pays the load time again.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - /mnt/mycelium/appdata/ollama/models:/root/.ollama/models
    ports:
      - '11434:11434'
    restart: unless-stopped
